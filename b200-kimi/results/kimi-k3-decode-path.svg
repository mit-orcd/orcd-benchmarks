      <rect class="mem-w"  x="1102" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="1102" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="1102" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="1117" y1="396" x2="1117" y2="428"/>
      <rect class="nvlink-bus" x="709" y="428" width="431" height="12" rx="6"/>
      <text class="link-t" x="709" y="462">NVLink &#8212; TP all-reduce, 2 per layer &#215; 46 layers = <tspan class="b">93 per token</tspan></text>
      <text class="link-v" x="709" y="481">14 KB per call · 4.16 GB/s per GPU &#8212; <tspan class="b">0.5% of 900 GB/s</tspan></text>

  <!-- inter-node pipeline hop -->
  <text class="link-t" x="600" y="300" text-anchor="middle">InfiniBand · 8-rail NDR</text>
  <text class="note-s" x="600" y="318" text-anchor="middle">hidden state, 14 KB / token</text>
  <line class="ib" x1="516" y1="340" x2="684" y2="340" marker-end="url(#ah-cool)"/>
  <text class="link-v" x="600" y="366" text-anchor="middle">0.026 GB/s = 0.006%</text>
  <text class="note-s" x="600" y="388" text-anchor="middle">one network hop added</text>
  <text class="note-s" x="600" y="404" text-anchor="middle">to every decode step</text>

  <!-- autoregressive loop -->
  <path class="loop" d="M1050,508 L1050,545 L844,545"/>
  <path class="loop" d="M356,545 L150,545 L150,512" marker-end="url(#ah)"/>
  <text class="note-s" x="600" y="549" text-anchor="middle">autoregressive loop &#8212; one token per sequence per step · 35.9 ms at 64 concurrent requests</text>

  <!-- ================= SCALE 3 : inside one GPU ================= -->
  <text class="eyebrow hot" x="40" y="600">SCALE 3 &#8212; INSIDE ONE GPU · THE BOTTLENECK</text>
  <rect class="panel-hot" x="40" y="620" width="1120" height="340" rx="10"/>
  <text class="node-id hot" x="58" y="650">G3 &#8212; ONE DECODE STEP</text>
  <text class="node-cap" x="1142" y="650" text-anchor="end">identical on all 16 GPUs</text>

  <!-- HBM -->
  <rect class="box" x="70" y="676" width="190" height="170" rx="6"/>
  <text class="box-t" x="165" y="704" text-anchor="middle">HBM3e</text>
  <text class="note-s" x="165" y="723" text-anchor="middle">192 GB · 8.0 TB/s</text>
  <rect class="stack" x="88" y="740" width="154" height="13"/>
  <rect class="stack" x="88" y="760" width="154" height="13"/>
  <rect class="stack" x="88" y="780" width="154" height="13"/>
  <rect class="stack" x="88" y="800" width="154" height="13"/>
  <rect class="stack" x="88" y="820" width="154" height="13"/>

  <!-- the hot path -->
  <text class="big-hot" x="340" y="736" text-anchor="middle">67 GB / step</text>
  <line class="pipe" x1="272" y1="754" x2="406" y2="754" marker-end="url(#ah-hot)"/>
  <line class="pipe-back" x1="406" y1="786" x2="274" y2="786" marker-end="url(#ah)"/>
  <text class="note-s" x="340" y="804" text-anchor="middle">activations back</text>
  <text class="note-s" x="340" y="826" text-anchor="middle">1,807 GB/s sustained</text>

  <!-- SMs -->
  <rect class="box" x="420" y="676" width="190" height="170" rx="6"/>
  <text class="box-t" x="515" y="704" text-anchor="middle">Blackwell SMs</text>
  <text class="note-s" x="515" y="723" text-anchor="middle">2,250 TFLOP/s BF16</text>
  <text class="idle-n" x="515" y="792" text-anchor="middle">0.97%</text>
  <text class="note-s" x="515" y="814" text-anchor="middle">of peak used</text>

  <rect class="seg-1" x="70.0" y="872" width="497.9" height="22"/>
      <text class="seg-lab" x="82.0" y="887">expert weights (MXFP4)  61.6 GB &#8212; 92.2%</text>
      <rect class="seg-2" x="567.9" y="872" width="26.5" height="22"/>
      <rect class="seg-3" x="594.3" y="872" width="14.6" height="22"/>
      <rect class="seg-4" x="608.9" y="872" width="1.6" height="22"/>
  <text class="note-s" x="70" y="916">then other weights 3.3 GB · KV cache read 1.8 GB · activations 0.2 GB &#8212; weight traffic is the whole story</text>

  <text class="util-l" x="680" y="726">HBM bandwidth <tspan class="util-s">1,807 of 8,000 GB/s</tspan></text>
      <rect class="util-track" x="680" y="734" width="340" height="14" rx="7"/>
      <rect class="util-hot" x="680" y="734" width="78.2" height="14" rx="7"/>
      <text class="util-v hot" x="1032" y="746">23%</text>
      <text class="util-l" x="680" y="764">Compute (BF16) <tspan class="util-s">21.8 of 2,250 TFLOP/s</tspan></text>
      <rect class="util-track" x="680" y="772" width="340" height="14" rx="7"/>
      <rect class="util-cool" x="680" y="772" width="3.3" height="14" rx="7"/>
      <text class="util-v" x="1032" y="784">0.97%</text>
      <text class="util-l" x="680" y="802">NVLink <tspan class="util-s">4.16 of 900 GB/s</tspan></text>
      <rect class="util-track" x="680" y="810" width="340" height="14" rx="7"/>
      <rect class="util-cool" x="680" y="810" width="3.0" height="14" rx="7"/>
      <text class="util-v" x="1032" y="822">0.46%</text>
      <text class="util-l" x="680" y="840">InfiniBand <tspan class="util-s">0.026 of 400 GB/s</tspan></text>
      <rect class="util-track" x="680" y="848" width="340" height="14" rx="7"/>
      <rect class="util-cool" x="680" y="848" width="3.0" height="14" rx="7"/>
      <text class="util-v" x="1032" y="860">0.006%</text>
  <text class="insight" x="680" y="892">The bottleneck &#8212; and it is latency-bound, not bandwidth-bound.</text>
  <text class="note-s" x="680" y="910">610 of 896 experts fire per layer, yet each sees only 1.7 tokens: a matrix&#8211;vector</text>
  <text class="note-s" x="680" y="926">product cannot keep enough memory requests in flight to fill 8 TB/s.</text>
</svg>
