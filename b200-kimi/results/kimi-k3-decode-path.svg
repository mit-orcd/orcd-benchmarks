<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img"
     aria-label="Kimi-K3 decode step across two B200 nodes: the 1,561 GB of weights exceed one node's 1,538 GB of HBM, forcing 16 GPUs in two pipeline stages; NVLink and InfiniBand run under one percent utilised while each GPU's HBM moves 67 GB per step at 23 percent of peak, the binding constraint.">
  <title>Kimi-K3 decode step: two-node HBM-bound compute and communication path</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path class="ah-hot" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ah-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="ah-cool" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; fill: #333F47; }
    .bg { fill: #FFFFFF; }
    .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: .14em; fill: #5D6970; }
    .eyebrow.hot { fill: #A8481A; }
    .h-svg { font-family: Chivo, "Segoe UI", sans-serif; font-size: 18px; font-weight: 700; fill: #151B20; letter-spacing: -.01em; }
    .body-svg { font-size: 13.5px; fill: #333F47; }
    .note { font-size: 12.5px; fill: #333F47; }
    .note-s { font-size: 11.5px; fill: #5D6970; }
    .over { font-size: 12px; font-weight: 600; fill: #A8481A; }
    .on-hot { font-size: 13px; font-weight: 600; fill: #2A1408; }
    .w-bar { fill: #C4571F; }
    .rt-bar { fill: none; stroke: #C4571F; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .cap-line { stroke: #151B20; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .leader { stroke: #C4571F; stroke-width: 1; }
    .flow { stroke: #151B20; stroke-width: 1.5; }
    .ah { fill: #151B20; } .ah-hot { fill: #C4571F; } .ah-cool { fill: #12708A; }
    .panel { fill: #F6F9FA; stroke: #CFD9DD; stroke-width: 1; }
    .panel-hot { fill: #F7EDE6; stroke: #C4571F; stroke-width: 1.4; }
    .node-id { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-weight: 500; letter-spacing: .11em; fill: #151B20; }
    .node-id.hot { fill: #A8481A; }
    .node-cap { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; fill: #5D6970; }
    .node-sub { font-size: 12px; fill: #5D6970; }
    .tile { fill: #FFFFFF; stroke: #CFD9DD; stroke-width: 1; }
    .tile-hi { fill: #FFFFFF; stroke: #C4571F; stroke-width: 2; }
    .gpu { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: #5D6970; }
    .mem-w { fill: #C4571F; }
    .mem-kv { fill: #E7B08B; }
    .mem-free { fill: none; stroke: #CFD9DD; stroke-width: 1; }
    .nvl-drop { stroke: #8FC4D2; stroke-width: 1.2; }
