    .link-t { font-size: 12.5px; fill: #333F47; }
    .link-v { font-size: 12.5px; fill: #12708A; }
    .link-t .b, .link-v .b { font-weight: 600; }
    .ib { stroke: #12708A; stroke-width: 2.5; stroke-dasharray: 8 5; }
