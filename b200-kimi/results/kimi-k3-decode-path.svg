  </style>

  <rect class="bg" x="0" y="0" width="1200" height="980"/>

  <!-- ================= SCALE 1 : the model ================= -->
  <text class="eyebrow" x="40" y="30">SCALE 1 &#8212; THE WHOLE MODEL</text>
  <text class="h-svg" x="40" y="54">2.78 T parameters · 1,561 GB of MXFP4 weights</text>

  <rect class="w-bar" x="40" y="76" width="771" height="30"/>
  <text class="on-hot" x="54" y="96">1,561 GB weights</text>
  <rect class="rt-bar" x="811" y="76" width="138" height="30"/>
  <text class="note" x="958" y="90">+ ~280 GB runtime</text>
  <text class="note-s" x="958" y="106">KV pool, activations, NCCL buffers</text>

  <line class="cap-line" x1="800" y1="66" x2="800" y2="120"/>
  <text class="note-s" x="800" y="136" text-anchor="middle">1,538 GB &#8212; all the HBM in one node (8 &#215; 192 GB)</text>
  <line class="leader" x1="806" y1="74" x2="856" y2="52"/>
  <text class="over" x="862" y="52">+23 GB over</text>

  <line class="flow" x1="60" y1="150" x2="60" y2="182" marker-end="url(#ah)"/>
  <text class="body-svg" x="78" y="170">23 GB short of a single node &#8212; so the job spans two, TP = 8 inside each, PP = 2 across the pair.</text>

  <!-- ================= SCALE 2 : 16 GPUs, 2 nodes ================= -->
  <text class="eyebrow" x="40" y="206">SCALE 2 &#8212; 16 GPUS ACROSS 2 NODES</text>

  <rect class="panel" x="40" y="218" width="470" height="290" rx="10"/>
      <text class="node-id" x="58" y="245">NODE 0</text>
      <text class="node-cap" x="492" y="245" text-anchor="end">8 &#215; B200 · 1,538 GB HBM</text>
      <text class="node-sub" x="58" y="264">pipeline stage 0 &#8212; layers 0 &#8230; 46 · TP = 8</text>
      <rect class="tile" x="59" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="82" y="295" text-anchor="middle">G0</text>
      <rect class="mem-w"  x="67" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="67" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="67" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="82" y1="396" x2="82" y2="428"/>
      <rect class="tile" x="114" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="137" y="295" text-anchor="middle">G1</text>
      <rect class="mem-w"  x="122" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="122" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="122" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="137" y1="396" x2="137" y2="428"/>
      <rect class="tile" x="169" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="192" y="295" text-anchor="middle">G2</text>
      <rect class="mem-w"  x="177" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="177" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="177" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="192" y1="396" x2="192" y2="428"/>
      <rect class="tile tile-hi" x="224" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="247" y="295" text-anchor="middle">G3</text>
      <rect class="mem-w"  x="232" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="232" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="232" y="378.8" width="30" height="11.2"/>
