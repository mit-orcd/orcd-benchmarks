      <rect class="mem-w"  x="827" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="827" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="827" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="842" y1="396" x2="842" y2="428"/>
      <rect class="tile" x="874" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="897" y="295" text-anchor="middle">G11</text>
      <rect class="mem-w"  x="882" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="882" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="882" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="897" y1="396" x2="897" y2="428"/>
      <rect class="tile" x="929" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="952" y="295" text-anchor="middle">G12</text>
      <rect class="mem-w"  x="937" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="937" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="937" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="952" y1="396" x2="952" y2="428"/>
      <rect class="tile" x="984" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="1007" y="295" text-anchor="middle">G13</text>
      <rect class="mem-w"  x="992" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="992" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="992" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="1007" y1="396" x2="1007" y2="428"/>
      <rect class="tile" x="1039" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="1062" y="295" text-anchor="middle">G14</text>
      <rect class="mem-w"  x="1047" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="1047" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="1047" y="378.8" width="30" height="11.2"/>
