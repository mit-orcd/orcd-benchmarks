      <rect class="mem-w"  x="342" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="342" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="342" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="357" y1="396" x2="357" y2="428"/>
      <rect class="tile" x="389" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="412" y="295" text-anchor="middle">G6</text>
      <rect class="mem-w"  x="397" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="397" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="397" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="412" y1="396" x2="412" y2="428"/>
      <rect class="tile" x="444" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="467" y="295" text-anchor="middle">G7</text>
      <rect class="mem-w"  x="452" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="452" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="452" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="467" y1="396" x2="467" y2="428"/>
      <rect class="nvlink-bus" x="59" y="428" width="431" height="12" rx="6"/>
      <text class="link-t" x="59" y="462">NVLink &#8212; TP all-reduce, 2 per layer &#215; 46 layers = <tspan class="b">93 per token</tspan></text>
      <text class="link-v" x="59" y="481">14 KB per call · 4.16 GB/s per GPU &#8212; <tspan class="b">0.5% of 900 GB/s</tspan></text>

  <rect class="panel" x="690" y="218" width="470" height="290" rx="10"/>
      <text class="node-id" x="708" y="245">NODE 1</text>
      <text class="node-cap" x="1142" y="245" text-anchor="end">8 &#215; B200 · 1,538 GB HBM</text>
      <text class="node-sub" x="708" y="264">pipeline stage 1 &#8212; layers 47 &#8230; 92 · TP = 8</text>
      <rect class="tile" x="709" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="732" y="295" text-anchor="middle">G8</text>
      <rect class="mem-w"  x="717" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="717" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="717" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="732" y1="396" x2="732" y2="428"/>
      <rect class="tile" x="764" y="280" width="46" height="116" rx="4"/>
      <text class="gpu" x="787" y="295" text-anchor="middle">G9</text>
      <rect class="mem-w"  x="772" y="302.0" width="30" height="47.7"/>
      <rect class="mem-kv" x="772" y="349.7" width="30" height="29.1"/>
      <rect class="mem-free" x="772" y="378.8" width="30" height="11.2"/>
      <line class="nvl-drop" x1="787" y1="396" x2="787" y2="428"/>
