<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img"
     aria-label="Sixteen GPUs across two nodes. Inside each GPU, arrows run between compute and HBM. Within each node, every GPU connects to an NVLink spine joining all eight. Between the nodes, dashed InfiniBand links join each GPU to its counterpart in the other node.">
  <title>Distributed inference topology: sixteen GPUs, two nodes, and the three data paths</title>
  <defs>
    <marker id="a-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C4571F"/></marker>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5D6970"/></marker>
    <marker id="a-cool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#12708A"/></marker>
  </defs>
  <style>
    text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; fill: #333F47; }
    .bg { fill: #FFFFFF; }
    .eyebrow { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11.5px;
                letter-spacing: .14em; fill: #5D6970; }
    .h1 { font-family: Chivo, "Segoe UI", sans-serif; font-size: 23px; font-weight: 700;
           fill: #151B20; letter-spacing: -.012em; }
    .sub { font-size: 13px; fill: #5D6970; }
    .panel { fill: #F6F9FA; stroke: #CFD9DD; stroke-width: 1; }
    .node-id { font-family: "IBM Plex Mono", monospace; font-size: 14px; font-weight: 500;
                letter-spacing: .12em; fill: #151B20; }
    .node-sub { font-size: 12px; fill: #5D6970; }
    .tile { fill: #FFFFFF; stroke: #CFD9DD; stroke-width: 1; }
    .gpu { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; font-weight: 500; fill: #5D6970; }
    .core { fill: #EFF3F4; stroke: #CFD9DD; stroke-width: 1; }
    .hbm { fill: #F7EDE6; stroke: #C4571F; stroke-width: 1.2; }
    .blk { font-size: 11.5px; fill: #333F47; }
    .hbm-t { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500; fill: #A8481A; }
    .rd { stroke: #C4571F; stroke-width: 5; }
    .wr { stroke: #5D6970; stroke-width: 1.6; }
    .spine { fill: #12708A; }
    .spine-t { font-size: 12px; fill: #12708A; letter-spacing: .04em; }
    .nvl { stroke: #12708A; stroke-width: 1.8; }
    .ib { stroke: #12708A; stroke-width: 2; stroke-dasharray: 9 6; }
    .ib-t { font-size: 13px; fill: #12708A; font-weight: 600; }
    .ib-s { font-size: 11.5px; fill: #5D6970; }
    .lg { font-size: 12.5px; fill: #333F47; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="940"/>

  <text class="eyebrow" x="40" y="40">KIMI-K3 · vLLM · TENSOR PARALLEL WITHIN A NODE, PIPELINE PARALLEL ACROSS NODES</text>
  <text class="h1" x="40" y="72">Sixteen GPUs, two nodes — and every path the data takes</text>
  <text class="sub" x="40" y="94">inside each GPU (HBM ⇄ compute) · among the GPUs of a node (NVLink) · between the nodes (InfiniBand)</text>

