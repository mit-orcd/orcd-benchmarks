  <rect class="bg" x="0" y="0" width="1200" height="660"/>

  <text class="eyebrow" x="70" y="42">HOW A VERY LARGE AI MODEL RUNS ON MORE THAN ONE COMPUTER</text>
  <text class="h1" x="70" y="76">The model is too big for one computer, so it runs on two</text>
  <text class="sub" x="70" y="102">Each box below is one computer, called a <tspan font-weight="600">node</tspan>. Inside each are GPUs — the chips that do the heavy work, each with its own memory.</text>
  <text class="sub" x="70" y="122">A cable joins the two boxes so they can work on the same model together.</text>

