<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img"
     aria-label="Two server computers drawn as rack boxes. Each box holds two GPUs, each GPU with its own memory, joined inside the box by a direct link. A network cable runs between the two boxes so they can work on the same model together.">
  <title>Why a large AI model needs more than one computer</title>
  <defs>
    <marker id="c-dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
            markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#12708A"/></marker>
